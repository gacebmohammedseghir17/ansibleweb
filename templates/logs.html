<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ansible Logs</title>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/logs.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}">
    <noscript>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </noscript>
</head>
<body>
<div class="d-flex">
    <div class="sidebar">
        <div class="sidebar-header">
            <h3 class="text-center logo">Ansible Dashboard</h3>
            <div class="header-icons">
                <button class="toggle-sidebar"><i class="fas fa-bars"></i></button>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="/playbooks" class="nav-item">
                <i class="fas fa-scroll"></i>
                <span>Playbooks</span>
            </a>
            <a href="/logs" class="nav-item active">
                <i class="fas fa-clipboard-list"></i>
                <span>Logs</span>
            </a>
            <a href="/schedule" class="nav-item">
                <i class="fas fa-calendar-alt"></i>
                <span>Schedule</span>
            </a>
            <a href="/docs" class="nav-item">
                <i class="fas fa-book"></i>
                <span>Documentation</span>
            </a>
            <a href="/chatbot" class="nav-item">
                <i class="fas fa-robot"></i>
                <span>AI Chatbot</span>
            </a>
            <div class="nav-divider"></div>
            <a href="/logout" class="nav-item">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
            <div class="user-info">
                <i class="fas fa-user"></i>
                <span>{{ current_user.username }} ({{ current_user.role }})</span>
            </div>
        </nav>
    </div>
    <div class="logs-content">
        <div class="section-header d-flex justify-content-between align-items-center mb-4">
            <h1 class="dashboard-title">Ansible Logs</h1>
            <div class="log-actions">
                <button class="btn btn-primary" onclick="exportLogs()"><i class="fas fa-download"></i> Export Logs</button>
            </div>
        </div>



        <!-- Log Display -->
        <div class="log-display">
            <!-- Terminal Style Log Display -->
            <div class="terminal-container">
                <div class="terminal-header">
                    <span class="terminal-title">ansible.log</span>
                    <div class="terminal-controls">
                        <span class="control minimize"></span>
                        <span class="control maximize"></span>
                        <span class="control close"></span>
                    </div>
                </div>
                <div class="terminal-content">
                    <pre class="logs" id="logContent">{{ ansible_log_content }}</pre>
                </div>
            </div>
        </div>

        <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
<script>
        function copyToClipboard() {
            const logContent = document.getElementById('logContent').textContent;
            navigator.clipboard.writeText(logContent).then(() => {
                alert('Log content copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }

        // Auto-scroll to bottom of terminal
        document.addEventListener('DOMContentLoaded', function() {
            const terminalContent = document.querySelector('.terminal-content');
            terminalContent.scrollTop = terminalContent.scrollHeight;
        });
        </script>



        <script>
        // Export logs
        function exportLogs() {
            const logContent = document.getElementById('logContent').textContent;
            const blob = new Blob([logContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ansible_logs_' + new Date().toISOString().slice(0, 10) + '.log';
            document.body.appendChild(a);
            a.click();
            
            // Cleanup
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
            
            // Show notification
            notifications.success('Logs exported successfully!');
        }

        // Initialize filters and view options
        document.addEventListener('DOMContentLoaded', function() {
            // Add event listeners for filters and view options
            // Initialize log display preferences
        });
        </script>

            </div>
        </div>
        
        <div class="footer text-center py-3">FAIT PAR GACEB & BENHARIGA</div>
    </div>
</div>
</body>
</html>
